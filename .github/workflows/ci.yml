name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      # --- Install FPC ---
      - name: Install FPC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc

      - name: Install FPC (macOS)
        if: runner.os == 'macOS'
        run: brew install fpc

      - name: Install FPC (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install freepascal --yes --no-progress
          # Add common FPC install paths
          $paths = @(
            "C:\FPC\3.2.2\bin\i386-win32",
            "C:\FPC\bin\i386-win32",
            "C:\tools\freepascal\bin",
            "C:\ProgramData\chocolatey\lib\freepascal\tools\bin\i386-win32"
          )
          foreach ($p in $paths) {
            if (Test-Path "$p\fpc.exe") {
              echo "Found FPC at: $p"
              echo $p | Out-File -FilePath $env:GITHUB_PATH -Append
              break
            }
          }
          # Fallback: search Program Files
          $found = Get-ChildItem -Path "C:\Program Files","C:\Program Files (x86)","C:\FPC","C:\ProgramData\chocolatey" -Recurse -Filter "fpc.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
            echo "Fallback found: $($found.DirectoryName)"
            echo $found.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      # --- Verify ---
      - name: Check FPC version
        run: fpc -iV

      # --- Linux / macOS: use Makefile ---
      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: make test

      - name: Build examples (Unix)
        if: runner.os != 'Windows'
        run: make examples

      # --- Windows: direct fpc invocation (avoids Makefile/bash path issues) ---
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist build\bin mkdir build\bin
          fpc -MObjFPC -Sh -O3 -gl -CR -Xs -Fusrc\core -Fusrc\text -Fusrc\layout -Fusrc\widgets -Fusrc\backend -Fusrc\terminal -Fusrc\input -Fusrc\app -Fusrc\platform -Futests -FEbuild\bin tests\test_runner.lpr
          if errorlevel 1 exit /b 1
          build\bin\test_runner.exe
          if errorlevel 1 exit /b 1

      - name: Build examples (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist build\bin mkdir build\bin
          for %%f in (examples\*.lpr) do (
            echo [BUILD] %%f
            fpc -MObjFPC -Sh -O3 -gl -CR -Xs -Fusrc\core -Fusrc\text -Fusrc\layout -Fusrc\widgets -Fusrc\backend -Fusrc\terminal -Fusrc\input -Fusrc\app -Fusrc\platform -Futests -FEbuild\bin %%f
            if errorlevel 1 exit /b 1
          )
